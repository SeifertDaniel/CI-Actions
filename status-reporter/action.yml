name: "Status Reporter"
description: "Reports CI status to a generic API"

inputs:
  api_status_endpoint:
    description: "API endpoint for commit status"
    required: true

  auth_token:
    description: "Authentication token for the API"
    required: true

  state:
    description: "Status state (success, failure, error, pending)"
    required: true

  context:
    description: "Status context identifier (e.g. ci/github)"
    required: false
    default: "ci/github"

  description:
    description: "Human readable status description"
    required: false
    default: "CI status reported"

  target_url:
    description: "URL with detailed build information"
    required: false

runs:
  using: "composite"
  steps:
    - name: Send commit status
      shell: bash
      run: |
        STATE="${{ inputs.state }}"
        CONTEXT="${{ inputs.context }}"
        DESCRIPTION="${{ inputs.description }}"
        TARGET_URL="${{ inputs.target_url }}"
        ENDPOINT="${{ inputs.api_status_endpoint }}"
        TOKEN="${{ inputs.auth_token }}"

        PAYLOAD=$(jq -n \
          --arg state "$STATE" \
          --arg context "$CONTEXT" \
          --arg description "$DESCRIPTION" \
          --arg target_url "$TARGET_URL" \
          '{
            state: $state,
            context: $context,
            description: $description,
            target_url: $target_url
          }')

        curl -fsSL -X POST \
          -H "Authorization: token $TOKEN" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "$ENDPOINT" \
          || echo "Status reporting failed - ignored."
