name: "OXID Plugin Test"
description: "Runs OXID plugin tests"

inputs:
  php_version:
    description: "PHP version used in this run"
    required: true

  syntax_check_paths:
    description: "Paths for PHP syntax check (comma separated). If empty, syntax check is skipped."
    required: false

  oxid_ref:
    description: "OXID version / ref used"
    required: true

  phpunit_version:
    description: "PHPUnit version constraint (e.g. ^9, ^10)"
    required: true

  sourceguardian:
    description: "Whether SourceGuardian is required"
    required: false
    default: "false"

  composer_package_name:
    description: "Composer package name (e.g. d3/mypackage)"
    required: true

  oxid_module_id:
    description: "OXID module ID (e.g. d3mypackage). If empty, module activation is skipped."
    required: false

  test_suites:
    description: "Comma separated list of test suites (e.g. unit,integration). If empty, run all tests."
    required: false

runs:
  using: "composite"
  steps:
    - name: Dump received inputs (debug)
      shell: bash
      run: |
        echo "PHP=${{ inputs.php_version }}"
        echo "OXID=${{ inputs.oxid_ref }}"
        echo "PHPUnit=${{ inputs.phpunit_version }}"
        echo "SourceGuardian=${{ inputs.sourceguardian }}"
        echo "Composer Package=${{ inputs.composer_package_name }}"
        echo "Module ID=${{ inputs.oxid_module_id }}"
        echo "Test Suites=${{ inputs.test_suites }}"

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:v2
        extensions: mbstring, intl, gd, mysql, zip, curl
        ini-values: |
          memory_limit=1G
          date.timezone=Europe/Berlin

    - name: Show PHP & Composer versions
      shell: bash
      run: |
        php -v
        composer --version

    - name: Install SourceGuardian Loader
      if: inputs.sourceguardian == 'true'
      shell: bash
      run: |
        PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
        LOADER=ixed.${PHP_VERSION}.lin

        curl -fsSL https://www.sourceguardian.com/loaders/download/loaders.linux-x86_64.tar.gz -o sg.tar.gz
        mkdir -p loaders ~/.php-ext
        tar -xzf sg.tar.gz -C ./loaders
        cp loaders/$LOADER ~/.php-ext/

    - name: Enable SourceGuardian Loader
      if: inputs.sourceguardian == 'true'
      shell: bash
      run: |
        echo "zend_extension=$HOME/.php-ext/ixed.$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;').lin" \
          > $HOME/sourceguardian.ini
        echo "sourceguardian.enable=1" >> $HOME/sourceguardian.ini

        PHP_INI_DIR=$(php -i | grep '^Scan this dir for additional .ini files =>' | sed 's/.*=> //')
        sudo cp $HOME/sourceguardian.ini "$PHP_INI_DIR/99-sourceguardian.ini"

        php -v | grep -i sourceguardian

    - name: PHP syntax check
      shell: bash
      run: |
        if [[ -z "${{ inputs.syntax_check_paths }}" ]]; then
          echo "No syntax check paths provided - skipping PHP syntax check."
          exit 0
        fi

        IFS=',' read -ra PATHS <<< "${{ inputs.syntax_check_paths }}"

        for RAW_PATH in "${PATHS[@]}"; do
          PATH_TRIMMED="$(echo "$RAW_PATH" | xargs)"

          if [[ -z "$PATH_TRIMMED" ]]; then
            continue
          fi

          if [[ -d "$PATH_TRIMMED" ]]; then
            echo "Syntax check in $PATH_TRIMMED"
            find "$PATH_TRIMMED" -name "*.php" -print0 | xargs -0 -n1 php -l
          else
            echo "Path '$PATH_TRIMMED' does not exist - skipped."
          fi
        done

    - name: Install OXID Shop
      shell: bash
      run: |
        composer create-project oxid-esales/oxideshop-project shop "${{ inputs.oxid_ref }}" --no-interaction --no-security-blocking

    - name: Install OXID dependencies
      shell: bash
      working-directory: shop
      run: |
        composer install --no-interaction --no-progress

    - name: Run OXID setup
      shell: bash
      working-directory: shop
      run: |
        : "${DB_HOST:?DB_HOST not set}"
        : "${DB_NAME:?DB_NAME not set}"
        : "${DB_USER:?DB_USER not set}"
        : "${DB_PASS:?DB_PASS not set}"

        vendor/bin/oe-console oe:setup:shop \
          --db-host="$DB_HOST" \
          --db-name="$DB_NAME" \
          --db-user="$DB_USER" \
          --db-password="$DB_PASS" \
          --db-port="${DB_PORT:-3306}" \
          --shop-url="http://localhost" \
          --shop-directory="$(pwd)/source" \
          --compile-directory="$(pwd)/source/tmp" \
          --language=de

    - name: Create OXID admin user
      shell: bash
      working-directory: shop
      run: |
        vendor/bin/oe-console oe:admin:create-user \
          --admin-email=ci@example.dev \
          --admin-password=admina

    - name: Activate OXID theme (if supported)
      shell: bash
      working-directory: shop
      run: |
        if vendor/bin/oe-console list | grep -q "oe:theme:activate"; then
          vendor/bin/oe-console oe:theme:activate apex
        else
          echo "Theme activation not supported in this OXID version - skipped."
        fi

    - name: Register plugin repository (path)
      shell: bash
      working-directory: shop
      run: |
        composer config repositories.plugin path ../

    - name: Install plugin via Composer
      shell: bash
      working-directory: shop
      run: |
        composer require "${{ inputs.composer_package_name }}:@dev" --no-interaction --no-progress

    - name: Activate OXID module
      shell: bash
      working-directory: shop
      run: |
        if [[ -z "${{ inputs.oxid_module_id }}" ]]; then
          echo "No OXID module ID provided - skipping module activation."
          exit 0
        fi

        echo "Activating OXID module: ${{ inputs.oxid_module_id }}"
        vendor/bin/oe-console oe:module:activate "${{ inputs.oxid_module_id }}"

    - name: Clear TMP folder
      shell: bash
      working-directory: shop
      run: |
        rm -rf ./source/tmp/*

    - name: Install PHPStan
      shell: bash
      if: ${{ hashFiles('phpstan.neon', 'phpstan.neon.dist') != '' }}
      working-directory: shop
      run: |
        composer require --dev \
          "phpstan/phpstan:^1" \
          --no-interaction \
          --no-progress

    - name: Run PHPStan
      shell: bash
      if: ${{ hashFiles('phpstan.neon', 'phpstan.neon.dist') != '' }}
      working-directory: shop
      run: |
        if [[ -f vendor/${{ inputs.composer_package_name }}/phpstan.neon ]]; then
          CONFIG="vendor/${{ inputs.composer_package_name }}/phpstan.neon"
        elif [[ -f vendor/${{ inputs.composer_package_name }}/phpstan.neon.dist ]]; then
          CONFIG="vendor/${{ inputs.composer_package_name }}/phpstan.neon.dist"
        else
          echo "No PHPStan config found, skipping."
          exit 0
        fi

        vendor/bin/phpstan analyse \
          --configuration="$CONFIG" \
          --no-progress \
          --quiet

    - name: Install PHPUnit
      shell: bash
      if: ${{ hashFiles('phpunit.xml') != '' }}
      working-directory: shop
      run: |
        composer require --dev \
          "phpunit/phpunit:${{ inputs.phpunit_version }}" \
          d3/testingtools:"*" \
          --no-interaction \
          --no-progress

    - name: Run PHPUnit tests
      shell: bash
      if: ${{ hashFiles('phpunit.xml') != '' }}
      working-directory: shop
      run: |
        if [[ -z "${{ inputs.test_suites }}" ]]; then
          echo "No test suites specified - running default PHPUnit configuration"

          vendor/bin/phpunit \
            --fail-on-risky \
            --fail-on-warning \
            --config="vendor/${{ inputs.composer_package_name }}" \
            --no-coverage \
            --bootstrap="$(pwd)/source/bootstrap.php"

        else
          IFS=',' read -ra SUITES <<< "${{ inputs.test_suites }}"

          for SUITE in "${SUITES[@]}"; do
        SUITE="$(echo "$SUITE" | xargs)"
            echo "Running test suite: $SUITE"

            vendor/bin/phpunit \
              --fail-on-risky \
              --fail-on-warning \
              --config="vendor/${{ inputs.composer_package_name }}" \
              --no-coverage \
              --bootstrap="$(pwd)/source/bootstrap.php" \
              --testsuite="$SUITE"
          done
        fi

