name: "OXID Plugin Test"
description: "Runs OXID plugin tests"

inputs:
  php_version:
    description: "PHP version used in this run"
    required: true

  syntax_check_paths:
    description: "Paths for PHP syntax check (comma separated). If empty, syntax check is skipped."
    required: false

  oxid_ref:
    description: "OXID version / ref used"
    required: true

  phpunit_version:
    description: "PHPUnit version constraint (e.g. ^9, ^10)"
    required: true

  sourceguardian:
    description: "Whether SourceGuardian is required"
    required: false
    default: "false"

  composer_package_name:
    description: "Composer package name (e.g. d3/mypackage)"
    required: true

  oxid_module_id:
    description: "OXID module ID (e.g. d3mypackage). If empty, module activation is skipped."
    required: false

  test_suites:
    description: "Comma separated list of test suites (e.g. unit,integration). If empty, run all tests."
    required: false

runs:
  using: "composite"
  steps:
    - uses: ./subactions/dump
      with:
        php_version: ${{ inputs.php_version }}
        oxid_ref: ${{ inputs.oxid_ref }}
        phpunit_version: ${{ inputs.phpunit_version }}
        sourceguardian: ${{ inputs.sourceguardian }}
        composer_package_name: ${{ inputs.composer_package_name }}
        oxid_module_id: ${{ inputs.oxid_module_id }}
        test_suites: ${{ inputs.test_suites }}

    - uses: ./subactions/php-setup
    - uses: ./subactions/sourceguardian
    - uses: ./subactions/syntax-check
    - uses: ./subactions/oxid-setup
    - uses: ./subactions/module-setup
    - uses: ./subactions/cleartmp
    - uses: ./subactions/phpstan
    - uses: ./subactions/phpunit
