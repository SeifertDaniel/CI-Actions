name: Composer Package CI

on:
  push:
    branches:
      - 'rel_*'
      - 'main'
      - 'master'
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"

    name: PHP ${{ matrix.php }} tests

    steps:
      - name: Checkout test plugin repository
        uses: actions/checkout@v4
        with:
          repository: d3datadevelopment/CI-Tests

      - name: Checkout CI Actions
        uses: actions/checkout@v4
        with:
          repository: d3datadevelopment/CI-Actions
          path: .ci-actions

      - name: Run package tests
        uses: ./.ci-actions/composer-package-test
        with:
          php_version: ${{ matrix.php }}
          syntax_check_paths: "Tests"
          test_suites: "unit,integration"

  report-status:
    runs-on: ubuntu-latest
    needs: package-tests
    if: always()
    steps:
      - name: Report CI status
        uses: d3datadevelopment/ci-actions/status-reporter@v1
        with:
          api_status_endpoint: "${{ vars.GITEA_API }}${{ github.sha }}"
          auth_token: ${{ secrets.GITEA_TOKEN }}
          state: ${{ needs.package-tests.result }}
          description: "CI result: ${{ needs.package-tests.result }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
