name: "AI Changelog Generator"
description: "Generate a Keep a Changelog compliant changelog entry using git-cliff and ChatGPT"


inputs:
  openai_api_key:
    description: "OpenAI API key"
    required: true
  repo_url:
    description: "Base repository URL (e.g. https://git.d3data.de/OWNER/REPO)"
    required: true
  push_token:
    description: "source repository push token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Collect commit messages
      shell: bash
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 --match "*.*.*.*" --first-parent 2>/dev/null || echo "")

        if [ -n "$LAST_TAG" ]; then
          echo "Using last tag on branch: $LAST_TAG"
          git log "${LAST_TAG}..HEAD" \
            --first-parent \
            --pretty=format:"- %s" \
          > raw_commits.txt
        else
          echo "No tag found on branch, using full history"
          git log \
            --first-parent \
            --pretty=format:"- %s" \
          > raw_commits.txt
        fi

        echo "====LIST===="
        cat raw_commits.txt

    - name: Generate Keep a Changelog entry via ChatGPT
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
      run: |
        python3 ${{ github.action_path }}/generate.py

    - name: Build Unreleased block
      shell: bash
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0.0")
        BRANCH_NAME=${GITHUB_REF_NAME}
        REPO_URL="${{ inputs.repo_url }}"

        if [ -z "$REPO_URL" ]; then
          echo "repo_url input is required"
          exit 1
        fi

        COMPARE_URL="${REPO_URL}/compare/${LAST_TAG}...${BRANCH_NAME}"

        cat > UNRELEASED_block.md <<EOF
        ## [Unreleased](${COMPARE_URL})
        $(cat changelog_entry.md)
        EOF

    - name: Update CHANGELOG.md (AI-managed Unreleased)
      shell: bash
      run: |
        CHANGELOG=CHANGELOG.md
        AI_BLOCK=UNRELEASED_block.md

        if [ ! -f "$CHANGELOG" ]; then
          echo "CHANGELOG.md not found"
          exit 1
        fi

        if [ ! -f "$AI_BLOCK" ]; then
          echo "UNRELEASED_block.md not found"
          exit 1
        fi

        awk '
        BEGIN {
          inserted = 0
          skip = 0
        }

        # Entferne bestehenden Unreleased-Block
        /^## \[Unreleased\]/ {
          skip = 1
          next
        }

        # Ende des alten Unreleased-Blocks erkennen
        skip && /^## \[/ {
          skip = 0
        }

        # Einfügepunkt: vor erstem Release-Header
        /^## \[/ && !inserted {
          while ((getline line < "'"$AI_BLOCK"'") > 0) print line
          close("'"$AI_BLOCK"'")
          print ""
          inserted = 1
        }

        # Normale Ausgabe
        !skip {
          print
        }

        END {
          # Falls es noch keine Releases gibt
          if (!inserted) {
            print ""
            while ((getline line < "'"$AI_BLOCK"'") > 0) print line
            close("'"$AI_BLOCK"'")
          }
        }
        ' "$CHANGELOG" > CHANGELOG.tmp

        mv CHANGELOG.tmp "$CHANGELOG"

    - name: Commit changelog
      shell: bash
      run: |
        REPO_URL="${{ inputs.repo_url }}"
        PUSH_TOKEN="${{ inputs.push_token }}"

        if [ -z "$REPO_URL" ]; then
          echo "repo_url input is required"
          exit 1
        fi

        if [ -z "$PUSH_TOKEN" ]; then
          echo "PUSH_TOKEN secret is required"
          exit 1
        fi

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        # Push-URL aus repo_url ableiten
        GITEA_PUSH_URL="${REPO_URL}.git"
        AUTH_GITEA_URL=$(echo "$GITEA_PUSH_URL" | sed "s#https://#https://${PUSH_TOKEN}@#")

        # Remote setzen (idempotent)
        if git remote | grep -q "^gitea$"; then
          git remote set-url gitea "$AUTH_GITEA_URL"
        else
          git remote add gitea "$AUTH_GITEA_URL"
        fi

        git add CHANGELOG.md
        git commit -m "docs: update unreleased section" || echo "No changes"
        git push gitea HEAD
