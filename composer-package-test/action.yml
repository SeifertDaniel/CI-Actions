name: "Composer Package Test"
description: "Runs tests for a generic Composer package"

inputs:
  php_version:
    description: "PHP version used in the test run"
    required: true

  syntax_check_paths:
    description: "Paths for PHP syntax check (comma separated). If empty, syntax check is skipped."
    required: false

  test_suites:
    description: "Comma separated list of test suites (e.g. unit,integration). If empty, run all tests."
    required: false

runs:
  using: "composite"
  steps:
    - uses: ../oxid-plugin-test/subactions/php-setup
    - uses: ../oxid-plugin-test/subactions/syntax-check
    - uses: ./subactions/package
    - uses: ./subactions/phpunit
